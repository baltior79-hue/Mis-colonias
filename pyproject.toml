[project]
name = "mis-colonias"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "flask",
    "requests",
    "beautifulsoup4",
    "gunicorn",
]

# gunicorn y Render siguen en server:app. Vercel carga la misma app desde
# api/index.py y le pasa la ruta original de cada petición.
[tool.vercel]
entrypoint = "api.index:app"
